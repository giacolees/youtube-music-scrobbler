name: YouTube Music Scrobble Sync

on:
  schedule:
    # Every 30 min at odd offsets (:18 and :48). Changing the cron
    # expression re-registers a previously stalled schedule.
    - cron: "18,48 * * * *"
  push:
    branches: [master] # Trigger on push to master branch
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  scrobble:
    runs-on: ubuntu-latest
    # Binds to the 'production' environment for secrets and protection rules
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Cache scrobble database
        uses: actions/cache@v4
        with:
          path: data.db
          key: >-
            ${{ runner.os }}-scrobble-db-${{ github.run_id }}-
            ${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-scrobble-db-${{ github.run_id }}-
            ${{ runner.os }}-scrobble-db-

      - name: Run YouTube Music Scrobbler
        env:
          LAST_FM_API: ${{ secrets.LAST_FM_API }}
          LAST_FM_API_SECRET: ${{ secrets.LAST_FM_API_SECRET }}
          LASTFM_SESSION: ${{ secrets.LASTFM_SESSION }}
          YTMUSIC_AUTH_KEY: ${{ secrets.YTMUSIC_AUTH_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SCROBBLE_TIMEZONE: Europe/Rome
        run: uv run python start_ytm_scobble.py

  notify_failure:
    needs: scrobble
    runs-on: ubuntu-latest
    if: failure()
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Send Discord failure notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          uv sync --frozen
          uv run python .github/scripts/send_failure_notification.py
